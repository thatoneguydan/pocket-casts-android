name: Build custom player APK

on:
  push:
    branches:
      - custom-player
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out custom player branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 preview platform
        run: yes | sdkmanager --channel=3 "platforms;android-37"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debugProd APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebugProd --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-casts-custom-player-apk
          path: app/build/outputs/apk/debugProd/*.apk
          if-no-files-found: error
          retention-days: 30
