name: Build Pocket Cantrips APK

on:
  push:
    branches:
      - custom-player
  pull_request:
    branches: [custom-player]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Check out custom player branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify affected-validation routing fixtures
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ github.workspace }}
        run: |
          node --test .github/scripts/validation-reuse.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'VALIDATION_ROUTING_FIXTURES_FAILED' }

      - name: Plan affected source validation
        id: validation_plan
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/validation-reuse.mjs custom-player-build-build
          if ($LASTEXITCODE -ne 0) { throw 'VALIDATION_PLAN_FAILED' }

      - name: Set up Java 21
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_0
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_1
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Install Android 17 SDK
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_2
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'ANDROID_SDK_INSTALL_FAILED' }

      - name: Validate checked-in Gradle wrapper
        id: wrapper_validation
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Set up Gradle cache
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_3
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Build debugProd APK
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_4
        run: |
          .\gradlew.bat :app:assembleDebugProd --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'APK_BUILD_FAILED' }

      - name: Upload installable APK
        if: ${{ steps.validation_plan.outputs.execute == 'true' }}
        id: validation_proof_5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pocket-cantrips-apk
          path: app/build/outputs/apk/debugProd/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: ${{ steps.validation_plan.outputs.receipt }}
        if: ${{ success() && steps.validation_plan.outputs.execute == 'true' && steps.wrapper_validation.outcome == 'success' && steps.validation_proof_0.outcome == 'success' && steps.validation_proof_1.outcome == 'success' && steps.validation_proof_2.outcome == 'success' && steps.validation_proof_3.outcome == 'success' && steps.validation_proof_4.outcome == 'success' && steps.validation_proof_5.outcome == 'success' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ github.workspace }}
        run: Write-Host 'Complete source checks executed; this receipt grants no package or live authority.'

