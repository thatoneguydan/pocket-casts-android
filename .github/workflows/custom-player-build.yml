name: Build custom player APK

on:
  push:
    branches:
      - custom-player
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out custom player branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Discover Android 17 SDK package
        run: |
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-packages.txt"
          echo "=== Android 17 / API 37 candidates ==="
          grep -i -E 'cinnamon|android-37|platforms;' "$RUNNER_TEMP/sdk-packages.txt" | tail -n 120 || true
          echo "=== End candidates ==="

      - name: Install Android 17 platform
        run: |
          if grep -q 'platforms;android-37' "$RUNNER_TEMP/sdk-packages.txt"; then
            yes | sdkmanager --channel=3 "platforms;android-37"
          elif grep -q 'platforms;android-CinnamonBun' "$RUNNER_TEMP/sdk-packages.txt"; then
            yes | sdkmanager --channel=3 "platforms;android-CinnamonBun"
          else
            echo "Android 17 platform package was not found by sdkmanager."
            exit 1
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debugProd APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebugProd --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-casts-custom-player-apk
          path: app/build/outputs/apk/debugProd/*.apk
          if-no-files-found: error
          retention-days: 30
