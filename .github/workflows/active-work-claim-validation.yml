name: Active Work Claim Validation

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [custom-player]
    paths:
      - '.github/workflows/active-work-claim-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-active-work-claim:
    name: Validate active-work ownership
    runs-on: [self-hosted, Windows, X64, glass-builder]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
    steps:
      - name: Validate claim metadata and collisions
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-SingleField {
            param(
              [Parameter(Mandatory = $true)][string]$Body,
              [Parameter(Mandatory = $true)][string]$Name,
              [bool]$Required = $true
            )

            $pattern = '(?im)^\s*(?:[-*]\s*)?' + [regex]::Escape($Name) + '\s*:\s*(?<value>[^\r\n]+?)\s*$'
            $matches = @([regex]::Matches($Body, $pattern))
            if ($matches.Count -eq 0) {
              if ($Required) { throw "Pull request body is missing '$($Name): <value>'." }
              return $null
            }
            if ($matches.Count -ne 1) { throw "Pull request body must contain exactly one '$($Name):' field." }

            $value = [string]$matches[0].Groups['value'].Value
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Pull request field '$Name' is empty." }
            return $value.Trim()
          }

          function Read-SurfaceSet {
            param([Parameter(Mandatory = $true)][string]$Value)

            $surfaces = @($Value.Split(';') | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ })
            if ($surfaces.Count -eq 0) { throw 'Conflict-Surfaces must name at least one ownership surface.' }
            foreach ($surface in $surfaces) {
              if ($surface -notmatch '^[a-z0-9][a-z0-9._/-]{0,63}$') {
                throw "Invalid conflict surface '$surface'. Use lowercase tokens separated by semicolons."
              }
            }
            if (@($surfaces | Select-Object -Unique).Count -ne $surfaces.Count) {
              throw 'Conflict-Surfaces contains duplicate tokens.'
            }
            return @($surfaces | Sort-Object -Unique)
          }

          function Get-PrFiles {
            param([Parameter(Mandatory = $true)][int]$Number)

            $apiPath = "repos/$env:GITHUB_REPOSITORY/pulls/$Number/files?per_page=100"
            $files = @(gh api $apiPath --paginate --jq '.[] | (.filename, .previous_filename) | select(. != null)')
            if ($LASTEXITCODE -ne 0) { throw "Could not read changed files for PR #$Number." }
            return @($files | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ } | Sort-Object -Unique)
          }

          $body = if ($env:EVENT_NAME -eq 'pull_request_target') {
            [string]$env:PR_BODY
          }
          else {
            @(
              'Work-ID: claim-contract-self-test',
              'Active-Work: thatoneguydan/DevelopmentInfrastructure#1',
              'Conflict-Surfaces: workflow-contract'
            ) -join [Environment]::NewLine
          }

          $workId = Read-SingleField -Body $body -Name 'Work-ID'
          $activeWork = Read-SingleField -Body $body -Name 'Active-Work'
          $surfaceText = Read-SingleField -Body $body -Name 'Conflict-Surfaces'
          $surfaces = @(Read-SurfaceSet -Value $surfaceText)

          if ($workId -notmatch '^[a-z0-9][a-z0-9._-]{2,95}$') {
            throw 'Work-ID must be a stable 3-96 character lowercase identifier.'
          }
          if ($activeWork -notmatch '^thatoneguydan/DevelopmentInfrastructure#[1-9][0-9]*$') {
            throw 'Active-Work must point to thatoneguydan/DevelopmentInfrastructure#<issue-number>.'
          }

          if ($env:EVENT_NAME -ne 'pull_request_target') {
            Write-Host 'Active-work claim workflow contract PASSED.' -ForegroundColor Green
            exit 0
          }

          if ($env:PR_HEAD_REPO -ne $env:GITHUB_REPOSITORY) {
            throw 'Material pull requests must use a branch in the canonical repository so ownership remains recoverable.'
          }

          $prNumber = [int]$env:PR_NUMBER
          $currentFiles = @(Get-PrFiles -Number $prNumber)
          if ($currentFiles.Count -eq 0) { throw 'Pull request has no changed files.' }

          $openNumbers = @(gh api "repos/$env:GITHUB_REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[].number')
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate open pull requests for collision detection.' }

          foreach ($otherNumberText in $openNumbers) {
            $otherNumber = [int]$otherNumberText
            if ($otherNumber -eq $prNumber) { continue }

            $other = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$otherNumber" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not read PR #$otherNumber for collision detection." }

            $otherFiles = @(Get-PrFiles -Number $otherNumber)
            $fileOverlap = @($currentFiles | Where-Object { $otherFiles -contains $_ })
            if ($fileOverlap.Count -gt 0) {
              throw "PR #$otherNumber already changes the same file(s): $($fileOverlap -join ', '). Adopt or reconcile that work before continuing."
            }

            $otherBody = [string]$other.body
            $otherWorkId = Read-SingleField -Body $otherBody -Name 'Work-ID' -Required $false
            $otherSurfaceText = Read-SingleField -Body $otherBody -Name 'Conflict-Surfaces' -Required $false
            if ($null -eq $otherSurfaceText) { continue }

            $otherSurfaces = @(Read-SurfaceSet -Value $otherSurfaceText)
            $surfaceOverlap = @($surfaces | Where-Object { $otherSurfaces -contains $_ })
            if ($surfaceOverlap.Count -gt 0 -and $otherWorkId -ne $workId) {
              throw "PR #$otherNumber already owns conflict surface(s): $($surfaceOverlap -join ', '). Adopt or reconcile that work before continuing."
            }
          }

          if ($env:GITHUB_REPOSITORY -eq 'thatoneguydan/DevelopmentInfrastructure') {
            $issueNumber = [int]($activeWork -replace '^.*#', '')
            $issue = gh api "repos/thatoneguydan/DevelopmentInfrastructure/issues/$issueNumber" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not read active-work issue #$issueNumber." }
            if ($null -ne $issue.pull_request) { throw "Active-Work #$issueNumber is a pull request, not an issue." }
            if ([string]$issue.state -ne 'open' -or -not ([string]$issue.title).StartsWith('[ACTIVE WORK]')) {
              throw "Active-Work #$issueNumber must be an open [ACTIVE WORK] issue."
            }

            $registryMatches = @([regex]::Matches([string]$issue.body, '(?im)^\s*(?:[-*]\s+)?\*\*Work ID:\*\*\s*(?<value>[^\r\n]+?)\s*$'))
            if ($registryMatches.Count -ne 1) { throw "Active-Work #$issueNumber must contain exactly one '**Work ID:**' field." }
            $registryWorkId = [string]$registryMatches[0].Groups['value'].Value.Trim()
            if ($registryWorkId -ne $workId) {
              throw "PR Work-ID '$workId' does not match Active-Work #$issueNumber Work ID '$registryWorkId'."
            }
          }

          Write-Host "Active-work ownership PASSED for '$workId'." -ForegroundColor Green
