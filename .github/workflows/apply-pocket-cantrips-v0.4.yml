name: Apply Pocket Cantrips v0.4 patch

on:
  push:
    branches:
      - custom-player
    paths:
      - .github/workflows/apply-pocket-cantrips-v0.4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom player branch
        uses: actions/checkout@v4
        with:
          ref: custom-player

      - name: Apply branding and artwork-space fixes
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/debugProd/res/values/titles.xml"); s=p.read_text(); old="<string name=\"app_name\">Pocket Debug</string>"; new="<string name=\"app_name\">Pocket Cantrips</string>"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("modules/features/player/src/main/java/au/com/shiftyjelly/pocketcasts/player/view/PlayerHeaderFragment.kt"); s=p.read_text(); old="            val spacingDp = 16.dp"; new="            val spacingDp = if (adPlaceable != null) 16.dp else 0.dp"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Remove one-shot patch workflow
        shell: bash
        run: rm .github/workflows/apply-pocket-cantrips-v0.4.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/debugProd/res/values/titles.xml \
                  modules/features/player/src/main/java/au/com/shiftyjelly/pocketcasts/player/view/PlayerHeaderFragment.kt \
                  .github/workflows/apply-pocket-cantrips-v0.4.yml
          git commit -m "Fix Pocket Cantrips title and reclaim artwork space"
          git push origin HEAD:custom-player
